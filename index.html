<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学食スマート混雑予測 & メニューナビ</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-12">

  <!-- ヘッダー -->
  <header class="bg-indigo-600 text-white p-4 shadow-lg">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 class="text-lg font-bold">学食ナビ (Nakano Campus)</h1>
      <span class="text-xs bg-indigo-500 px-2 py-1 rounded">Beta v1.0</span>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-6">

    <!-- 1. 現在の混雑度エリア -->
    <section class="bg-white rounded-2xl p-5 shadow-md border border-slate-200">
      <div class="flex justify-between items-center mb-2">
        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">現在時刻 (推定)</span>
        <span id="current-time" class="text-sm font-bold text-slate-600">12:15</span>
      </div>
      
      <div class="text-center my-4">
        <p class="text-sm text-slate-500 mb-1">現在の混雑度</p>
        <div class="flex justify-center items-baseline gap-1">
          <span id="congestion-rate" class="text-5xl font-black text-rose-500">85</span>
          <span class="text-xl font-bold text-rose-500">%</span>
        </div>
        <p id="congestion-status" class="mt-2 inline-block px-3 py-1 bg-rose-100 text-rose-700 text-xs font-bold rounded-full">
          激混み（待ち時間発生中）
        </p>
      </div>

      <!-- プログレスバー -->
      <div class="w-full bg-slate-200 rounded-full h-3 overflow-hidden">
        <div id="progress-bar" class="bg-rose-500 h-full transition-all duration-500" style="width: 85%"></div>
      </div>

      <!-- ロジック補足説明 -->
      <div class="mt-4 p-3 bg-slate-50 rounded-lg text-xs text-slate-500 leading-relaxed">
        💡 <strong>データ構造:</strong> 時間割ベース予測 + 現場投稿によるリアルタイム補正
      </div>
    </section>

    <!-- 2. リアルタイム投票（生データ補正） -->
    <section class="bg-white rounded-2xl p-5 shadow-md border border-slate-200">
      <h2 class="text-sm font-bold text-slate-700 mb-1">現場の混雑状況を報告</h2>
      <p class="text-xs text-slate-400 mb-4">1タップ投稿で全体の予測精度と待ち時間が再計算されます</p>

      <div class="grid grid-cols-3 gap-2">
        <button onclick="vote(-20)" class="p-3 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-emerald-700 text-xs font-bold rounded-xl flex flex-col items-center gap-1 transition">
          <span class="text-lg">🟢</span>
          空いてる
        </button>
        <button onclick="vote(0)" class="p-3 bg-amber-50 hover:bg-amber-100 border border-amber-200 text-amber-700 text-xs font-bold rounded-xl flex flex-col items-center gap-1 transition">
          <span class="text-lg">🟡</span>
          普通
        </button>
        <button onclick="vote(20)" class="p-3 bg-rose-50 hover:bg-rose-100 border border-rose-200 text-rose-700 text-xs font-bold rounded-xl flex flex-col items-center gap-1 transition">
          <span class="text-lg">🔴</span>
          激混み
        </button>
      </div>
      <p id="vote-feedback" class="text-xs text-center text-emerald-600 font-bold mt-3 hidden">
        ご協力ありがとうございます！混雑度と提供時間を補正しました。
      </p>
    </section>

    <!-- 3. 条件絞り込みメニュー提案（混雑度動的連動） -->
    <section class="bg-white rounded-2xl p-5 shadow-md border border-slate-200">
      <div class="mb-3">
        <h2 class="text-sm font-bold text-slate-700">残り時間から爆速メニュー検索</h2>
        <p class="text-[11px] text-slate-400">※混雑度80%以上でラーメン等の注文後調理メニューの提供時間が自動加算されます</p>
      </div>
      
      <div class="flex gap-2 mb-4">
        <button onclick="filterMenu(10)" class="px-3 py-1.5 bg-slate-100 hover:bg-indigo-50 border text-xs font-medium rounded-lg">10分以内で食べたい</button>
        <button onclick="filterMenu(20)" class="px-3 py-1.5 bg-slate-100 hover:bg-indigo-50 border text-xs font-medium rounded-lg">20分以内</button>
        <button onclick="filterMenu(99)" class="px-3 py-1.5 bg-indigo-600 text-white text-xs font-medium rounded-lg">すべて表示</button>
      </div>

      <div id="menu-list" class="space-y-3">
        <!-- JSで動的生成 -->
      </div>
    </section>

  </main>

  <script>
    // 初期混雑度（時間割ベース予測）
    let currentRate = 85;
    let currentFilterTime = 99;

    // メニューマスターデータ (isCookToOrder: 注文後調理フラグ)
    const menus = [
      { name: "スピードカレー", baseTime: 3, price: 400, tag: "作り置き・爆速", isCookToOrder: false },
      { name: "日替わり小鉢セット", baseTime: 3, price: 350, tag: "作り置き・爆速", isCookToOrder: false },
      { name: "醤油ラーメン", baseTime: 4, price: 420, tag: "注文後調理", isCookToOrder: true },
      { name: "日替わり唐揚げ定食", baseTime: 6, price: 480, tag: "注文後調理", isCookToOrder: true }
    ];

    // 混雑度に応じた提供時間の再計算ロジック（コアアルゴリズム）
    function getEstimatedTime(menu) {
      // 注文後調理メニューで、かつ混雑度が80%以上の場合のみボトルネック（茹で釜・調理待ち）が発生
      if (menu.isCookToOrder && currentRate >= 80) {
        return menu.baseTime + 10; // 混雑で+10分動的加算
      }
      return menu.baseTime;
    }

    // UI更新関数
    function updateUI() {
      currentRate = Math.max(0, Math.min(100, currentRate));
      
      document.getElementById('congestion-rate').innerText = currentRate;
      document.getElementById('progress-bar').style.width = currentRate + '%';

      const statusEl = document.getElementById('congestion-status');
      const progressBar = document.getElementById('progress-bar');

      if (currentRate >= 80) {
        statusEl.innerText = "激混み（注文後調理メニューは+10分遅延中）";
        statusEl.className = "mt-2 inline-block px-3 py-1 bg-rose-100 text-rose-700 text-xs font-bold rounded-full";
        progressBar.className = "bg-rose-500 h-full transition-all duration-500";
      } else if (currentRate >= 40) {
        statusEl.innerText = "やや混雑（順調に提供中）";
        statusEl.className = "mt-2 inline-block px-3 py-1 bg-amber-100 text-amber-700 text-xs font-bold rounded-full";
        progressBar.className = "bg-amber-500 h-full transition-all duration-500";
      } else {
        statusEl.innerText = "空いています（すぐ買える！）";
        statusEl.className = "mt-2 inline-block px-3 py-1 bg-emerald-100 text-emerald-700 text-xs font-bold rounded-full";
        progressBar.className = "bg-emerald-500 h-full transition-all duration-500";
      }

      // 混雑度変更に伴いメニュー一覧を再描画
      renderMenus(currentFilterTime);
    }

    // ユーザー投票処理
    function vote(delta) {
      currentRate += delta;
      updateUI();
      
      const feedback = document.getElementById('vote-feedback');
      feedback.classList.remove('hidden');
      setTimeout(() => feedback.classList.add('hidden'), 3000);
    }

    // メニュー一覧描画処理
    function renderMenus(limitTime = 99) {
      currentFilterTime = limitTime;
      const container = document.getElementById('menu-list');
      container.innerHTML = '';

      // 計算後の動的提供時間をもとにフィルタリング
      const filtered = menus.filter(m => getEstimatedTime(m) <= limitTime);

      if (filtered.length === 0) {
        container.innerHTML = `<p class="text-xs text-slate-400 py-2">※混雑による遅延のため、${limitTime}分以内で提供できるメニューがありません</p>`;
        return;
      }

      filtered.forEach(m => {
        const estimatedTime = getEstimatedTime(m);
        const isDelayed = estimatedTime > m.baseTime;

        container.innerHTML += `
          <div class="flex justify-between items-center p-3 bg-slate-50 rounded-xl border border-slate-100">
            <div>
              <div class="flex items-center gap-2">
                <span class="text-xs font-bold text-slate-800">${m.name}</span>
                <span class="text-[10px] bg-slate-200 text-slate-600 px-1.5 py-0.5 rounded">${m.tag}</span>
              </div>
              <p class="text-[11px] text-slate-400 mt-0.5">
                提供目安: 
                <strong class="${isDelayed ? 'text-rose-500 font-bold' : 'text-slate-600'}">約${estimatedTime}分</strong>
                ${isDelayed ? '<span class="text-[10px] text-rose-500">(混雑遅延+10分)</span>' : ''}
              </p>
            </div>
            <span class="text-sm font-black text-indigo-600">¥${m.price}</span>
          </div>
        `;
      });
    }

    function filterMenu(time) {
      renderMenus(time);
    }

    // 初期化
    updateUI();
  </script>
</body>
</html>
